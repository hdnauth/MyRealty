name: Android

# Android 앱(TWA, apps/android) 빌드. 화면·기능은 웹에 있으므로 이 앱은 아이콘·도메인·버전이 바뀔 때만 새로 올리면 된다.
# - PR·push: 서명 없이 빌드만 확인
# - 수동 실행(Run workflow): GitHub Secrets 의 업로드 키로 서명한 .aab 를 만들어 아티팩트로 올리고,
#   PLAY_SERVICE_ACCOUNT_JSON 이 있으면 Play Console 의 선택한 트랙(기본 internal)에 바로 올린다.
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, (선택) PLAY_SERVICE_ACCOUNT_JSON
# 버전 코드는 실행 번호(run_number)를 써서 매번 올라간다. 버전 이름은 apps/android/gradle.properties 의 twa.versionName.
on:
  push:
    branches: [main]
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      track:
        description: "Play 트랙(internal | alpha(비공개 테스트) | production). 서비스 계정이 없으면 무시"
        required: false
        default: internal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    env:
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build (unsigned check)
        if: github.event_name != 'workflow_dispatch'
        run: ./gradlew --no-daemon lintRelease bundleRelease

      - name: Decode upload key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없습니다(apps/android/README.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -Ptwa.versionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: myrealty-${{ github.run_number }}.aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 첫 번째 .aab 는 Play Console 에서 직접 올려야 한다(API 업로드는 앱이 만들어진 뒤부터 가능)
      - name: Upload to Google Play
        if: github.event_name == 'workflow_dispatch' && env.HAS_PLAY_JSON == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yarch.myrealty
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft
