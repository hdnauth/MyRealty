name: Check keys

# GitHub Secrets/Variables 에 넣은 키가 비었거나 잘못됐는지 실제 호출로 확인한다(값은 출력하지 않음).
# Actions → Check keys → Run workflow. 결과는 실행 요약(Summary) 표와 웹 관리 → 시스템 화면에서 본다.
on:
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/etl
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
      VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
      ECOS_KEY: ${{ secrets.ECOS_KEY }}
      KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
      REB_KEY: ${{ secrets.REB_KEY }}
      NCP_MAPS_KEY_ID: ${{ secrets.NCP_MAPS_KEY_ID }}
      NCP_MAPS_KEY: ${{ secrets.NCP_MAPS_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_BULK_MODEL: ${{ vars.ANTHROPIC_BULK_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run myrealty doctor --strict
