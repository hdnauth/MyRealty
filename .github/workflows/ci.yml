name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 루트에 package.json 이 없어 pnpm 버전(packageManager)을 apps/web 에서 읽는다
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-build-secret

  etl:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: myrealty
          POSTGRES_PASSWORD: myrealty
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/etl
    env:
      TEST_DATABASE_URL: postgresql://myrealty:myrealty@localhost:5432/myrealty_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # postgis 이미지에는 pgvector 가 없어 공식 pgvector 이미지에서 확장 파일을 복사한다.
      # (postgis 이미지는 Debian bullseye 기반인데 apt.postgresql.org 에서 bullseye 가 빠져 apt 설치가 실패한다)
      - name: Install pgvector
        run: |
          src=$(docker create pgvector/pgvector:0.8.7-pg16-bookworm)
          docker cp "$src:/usr/lib/postgresql/16/lib/vector.so" /tmp/vector.so
          docker cp "$src:/usr/share/postgresql/16/extension" /tmp/pgext
          docker rm "$src"
          pg=${{ job.services.postgres.id }}
          docker cp /tmp/vector.so "$pg:/usr/lib/postgresql/16/lib/vector.so"
          for f in /tmp/pgext/vector*; do docker cp "$f" "$pg:/usr/share/postgresql/16/extension/"; done
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
