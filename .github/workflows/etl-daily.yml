name: ETL daily

on:
  schedule:
    # 매일 05:50 KST (20:50 UTC 전날)
    - cron: "50 20 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "실행할 단계(공백 구분, 비우면 전체)"
        required: false
        default: ""

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/etl
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
      VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
      ECOS_KEY: ${{ secrets.ECOS_KEY }}
      KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
      REB_KEY: ${{ secrets.REB_KEY }}
      NCP_MAPS_KEY_ID: ${{ secrets.NCP_MAPS_KEY_ID }}
      NCP_MAPS_KEY: ${{ secrets.NCP_MAPS_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      ANTHROPIC_BULK_MODEL: ${{ vars.ANTHROPIC_BULK_MODEL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      # 웹(Vercel 서울 리전)을 거쳐 국내 API 를 부르는 중계 인증(웹과 같은 값). 러너(해외)에서 직접 호출이 막힐 때 쓴다
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      KR_RELAY: ${{ vars.KR_RELAY }}
      # 수집 단계 시간 예산(분). 위 단계 timeout(45분)보다 짧게
      DAILY_BUDGET_MIN: ${{ vars.DAILY_BUDGET_MIN || '38' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run myrealty migrate
      # 키 점검: 결과는 실행 요약과 관리 → 시스템 화면에 남는다. 실패해도 수집은 계속한다.
      - run: uv run myrealty doctor
        continue-on-error: true
      # 수집·분석: 시간 예산(DAILY_BUDGET_MIN)이 지나면 남은 수집은 다음 실행으로 넘기고, 그래도 멈추면 단계 timeout 으로 끊는다
      - name: 수집·분석
        timeout-minutes: 45
        run: uv run myrealty daily --stage collect ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      # 알림·발송·정리: 수집이 실패하거나 시간을 넘겨도 실행(수동 취소 때만 건너뜀)
      - name: 알림·발송·정리
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: uv run myrealty daily --stage notify ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
