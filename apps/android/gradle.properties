org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# ── 앱 설정(바꾸면 웹의 ANDROID_PACKAGE_NAME·assetlinks 와 맞춘다) ──
# 패키지명은 Play 에 처음 올린 뒤에는 바꿀 수 없다
twa.applicationId=com.yarch.myrealty
# 웹 배포 도메인(https 만, 경로 없이)
twa.host=myrealty.vercel.app
twa.launchPath=/
# 버전: CI 는 -Ptwa.versionCode=<빌드 번호> 로 덮어쓴다
twa.versionCode=1
twa.versionName=1.0.0
