[project]
name = "myrealty-etl"
version = "0.1.0"
description = "MyRealty 공공데이터 수집·지표 계산·AI 배치"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "numpy>=1.26",
  "anthropic>=1.0",
  "python-dateutil>=2.9",
  "pywebpush>=2.0",
  "pyshp>=2.3",
]

[project.scripts]
myrealty = "myrealty_etl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myrealty_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
